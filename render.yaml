services:
  - type: web
    name: captain-yami-session-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PAIRING_SITE_KEY
        generateValue: true
      - key: SESSION_ROOT
        value: ./sessions
      - key: PAIRING_REQUEST_DELAY_MS
        value: 2500
