services:
  - type: web
    name: captain-yami-session-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PAIRING_SITE_KEY
        generateValue: true
      - key: SESSION_AUTH_DIR
        value: ./auth_info
      - key: PAIRING_REQUEST_DELAY_MS
        value: 2500
